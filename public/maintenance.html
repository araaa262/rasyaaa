<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --white: #ffffff;
  --blue-50: #eff6ff;
  --blue-100: #dbeafe;
  --blue-200: #bfdbfe;
  --blue-400: #60a5fa;
  --blue-500: #3b82f6;
  --blue-600: #2563eb;
  --ink-900: #0f172a;
  --ink-700: #334155;
  --ink-500: #64748b;
  --ink-400: #94a3b8;
  --ink-300: #cbd5e1;
  --ink-100: #f1f5f9;
  --dark: #011522;
  --green: #00ca4e;
  --red: #ff605c;
  --yellow: #ffbd44;
  --shadow-cartoon: 6px 6px 0 0 var(--ink-900);
}

html, body { height: 100%; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 10% 10%, var(--blue-50) 0%, transparent 40%),
    radial-gradient(circle at 90% 90%, var(--blue-100) 0%, transparent 40%),
    #f8fafc;
  color: var(--ink-900);
  font-family: "Plus Jakarta Sans", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(var(--blue-200) 1px, transparent 1px);
  background-size: 22px 22px;
  opacity: 0.35;
  z-index: -1;
  animation: bgDrift 30s linear infinite;
  pointer-events: none;
}

@keyframes bgDrift {
  0%   { background-position: 0 0; }
  100% { background-position: 220px 220px; }
}

.wrap {
  width: min(520px, 100%);
  opacity: 0;
  transform: translateY(24px);
  animation: reveal 0.9s cubic-bezier(0.34, 1.4, 0.64, 1) 0.15s forwards;
}

@keyframes reveal { to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--white);
  border: 2px solid var(--ink-900);
  box-shadow: var(--shadow-cartoon);
  overflow: hidden;
}

.term-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--dark);
  border-bottom: 2px solid var(--ink-900);
  min-height: 40px;
}

.term-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
}
.term-dot.red    { background: var(--red); }
.term-dot.yellow { background: var(--yellow); }
.term-dot.green  { background: var(--green); }

.term-title {
  flex: 1;
  text-align: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 500;
  color: rgba(148,163,184,0.85);
  letter-spacing: 0.6px;
  padding-right: 45px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.body {
  padding: 32px 24px 28px;
  text-align: center;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border: 2px solid var(--ink-900);
  background: var(--yellow);
  color: var(--ink-900);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  box-shadow: 2px 2px 0 var(--ink-900);
  margin-bottom: 16px;
}

.icon-wrap {
  position: relative;
  width: 96px;
  height: 96px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px dashed var(--blue-400);
  animation: spinRing 8s linear infinite;
}

@keyframes spinRing { to { transform: rotate(360deg); } }

.icon-core {
  width: 72px;
  height: 72px;
  border: 2px solid var(--ink-900);
  background: linear-gradient(135deg, var(--blue-500) 0%, var(--blue-600) 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  box-shadow: 4px 4px 0 var(--ink-900);
  animation: pulseCore 2.5s ease-in-out infinite;
  z-index: 1;
}

@keyframes pulseCore {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50%      { transform: scale(1.06) rotate(-3deg); }
}

.title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--ink-900);
  margin-bottom: 8px;
}

.title span { color: var(--blue-600); }

.subtitle {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-500);
  line-height: 1.6;
  margin-bottom: 22px;
  padding: 0 8px;
}

.subtitle b { color: var(--ink-900); font-weight: 700; }

.status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 14px;
  border: 2px solid var(--ink-900);
  background: var(--blue-50);
  box-shadow: 3px 3px 0 var(--ink-900);
  margin-bottom: 22px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-900);
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--yellow);
  box-shadow: 0 0 0 3px rgba(255, 189, 68, 0.3);
  animation: blink 1.4s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes blink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.85); }
}

/* LOADING BAR (indeterminate) */
.loading-bar {
  width: 100%;
  height: 8px;
  background: var(--ink-100);
  border: 2px solid var(--ink-900);
  box-shadow: 3px 3px 0 var(--ink-900);
  overflow: hidden;
  margin-bottom: 22px;
  position: relative;
}

.loading-bar-fill {
  height: 100%;
  width: 40%;
  background: linear-gradient(90deg, var(--blue-400), var(--blue-600));
  position: absolute;
  top: 0;
  left: 0;
  animation: slideBar 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  border-radius: 2px;
}

@keyframes slideBar {
  0%   { left: -40%; }
  100% { left: 100%; }
}

.divider {
  border-top: 2px dashed var(--ink-300);
  margin: 0 0 20px;
}

.social-title {
  font-size: 9px;
  font-weight: 800;
  color: var(--ink-500);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.social-grid {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.social-btn {
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--ink-900);
  background: var(--white);
  color: var(--ink-900);
  text-decoration: none;
  font-size: 17px;
  box-shadow: 3px 3px 0 var(--ink-900);
  transition: all 0.2s cubic-bezier(0.34, 1.4, 0.64, 1);
}

.social-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--ink-900);
  color: #fff;
}

.social-btn:active {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 var(--ink-900);
}

.social-btn i { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.social-btn:hover i { transform: scale(1.15) rotate(-6deg); }

.social-btn.github:hover   { background: #24292e; }
.social-btn.telegram:hover { background: #229ED9; }
.social-btn.tiktok:hover   { background: #000000; }
.social-btn.whatsapp:hover { background: #25D366; }

.footer {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 2px dashed var(--ink-300);
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-500);
  letter-spacing: 0.3px;
}

.footer i { color: var(--blue-600); margin-right: 5px; }
.footer span { color: var(--blue-600); font-weight: 800; }

@media (max-width: 480px) {
  body { padding: 14px; }
  .body { padding: 24px 16px 22px; }
  .title { font-size: 19px; }
  .subtitle { font-size: 11.5px; }
  .icon-wrap { width: 84px; height: 84px; }
  .icon-core { width: 64px; height: 64px; font-size: 26px; }
  .social-btn { width: 40px; height: 40px; font-size: 15px; }
}


/* NEOBRUTALISM SKY-CLOUD THEME — cohesive site-wide refresh */
:root {
  --white:#fafdff; --blue-50:#f0f9ff; --blue-100:#dff3ff; --blue-200:#aee4ff;
  --blue-400:#55c5ff; --blue-500:#38bdf8; --blue-600:#168bd0;
  --ink-900:#102b43; --ink-700:#244b68; --ink-500:#53758d; --ink-400:#7798ad;
  --ink-300:#b9d9eb; --ink-100:#edf8ff; --dark:#102b43;
  --shadow-cartoon:5px 5px 0 #102b43; --shadow-cartoon-sm:4px 4px 0 #102b43;
}
body { background-color:#f3fbff; background-image:radial-gradient(ellipse at 12% 8%,#fff 0,transparent 33%),radial-gradient(ellipse at 88% 20%,#d8f2ff 0,transparent 34%),linear-gradient(135deg,#f5fcff,#e8f7ff 55%,#fafdff); }
body::before { background-image:radial-gradient(#8bd8ff 1.2px,transparent 1.2px); background-size:25px 25px; opacity:.28; animation:bgDrift 22s linear infinite; }
@keyframes cloudFloat { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-5px) rotate(-.5deg)} }
@keyframes buttonBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
@keyframes skyShimmer { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
@keyframes cutePop { 0%{transform:scale(1)} 45%{transform:scale(1.045) rotate(-1deg)} 100%{transform:scale(1)} }
/* Crisp black-outline cards, cloud-blue surfaces and offset ink shadows */
.page,.wrap { position:relative; }
.header,.section,.about,.card,.loading-card,.results,.modal,.sidebar-brand,.sidebar-banner,.brand-icon,.icon-wrap,.term-head,.form-body,.about-brand,.data-row,.field,.input-wrapper,.result-actions,.empty,.badge,.status,.social-btn,.channel-link,.loading-visual {
  border-color:var(--ink-900)!important;
}
.header,.section,.about,.card,.loading-card,.results,.modal,.form-body,.data-row,.field,.input-wrapper,.loading-visual { box-shadow:4px 4px 0 var(--ink-900)!important; }
.header,.section,.about,.card,.loading-card,.results,.modal,.form-body,.data-row,.field,.input-wrapper { border-radius:14px!important; }
.header,.section,.about,.card,.loading-card,.results,.form-body { background:rgba(250,253,255,.94)!important; }
.sidebar { background:#fafdff!important; }
.sidebar-head,.term-head,.header-top { background:#cceeff!important; color:var(--ink-900)!important; }
.sidebar-head-title,.term-title { color:var(--ink-700)!important; }
.sidebar-brand,.brand-wrap,.about-brand { background:#e3f6ff!important; border-radius:12px!important; }
.sidebar-item,.action-btn,.execute-btn,.hamburger,.sidebar-close,.modal-join-btn,.social-btn,.channel-link,.copy-value,.result-actions button,.about-footer a {
  border:2px solid var(--ink-900)!important; border-radius:10px!important; font-weight:800!important;
  box-shadow:3px 3px 0 var(--ink-900)!important; transition:transform .18s ease,box-shadow .18s ease,background .2s ease!important;
}
.sidebar-item,.action-btn,.execute-btn,.modal-join-btn,.social-btn,.channel-link,.copy-value { background:linear-gradient(135deg,#e5f7ff,#bceaff)!important; color:var(--ink-900)!important; }
.sidebar-item:hover,.action-btn:hover,.execute-btn:hover,.hamburger:hover,.modal-join-btn:hover,.social-btn:hover,.channel-link:hover,.copy-value:hover,.about-footer a:hover {
  transform:translate(-2px,-3px) rotate(-.5deg)!important; box-shadow:5px 6px 0 var(--ink-900)!important; background:#8cdbff!important; color:var(--ink-900)!important;
}
.sidebar-item:active,.action-btn:active,.execute-btn:active,.hamburger:active,.modal-join-btn:active,.social-btn:active,.channel-link:active,.copy-value:active { transform:translate(2px,2px) scale(.98)!important; box-shadow:1px 1px 0 var(--ink-900)!important; }
.execute-btn,.modal-join-btn { background:linear-gradient(100deg,#70d1ff,#b8eaff,#70d1ff)!important; background-size:200% 100%!important; animation:skyShimmer 5s linear infinite; }
.hamburger { background:#bdeaff!important; }
.action-btn.danger { background:#ffd9df!important; }
input,textarea,select,.input-wrapper input,.field input,.field textarea { border-color:var(--ink-900)!important; border-radius:9px!important; background:#fff!important; color:var(--ink-900)!important; }
input:focus,textarea:focus,select:focus { outline:3px solid #8bd8ff!important; outline-offset:2px; }
.label,.data-label,.sidebar-section-title { color:var(--ink-700)!important; }
.badge,.status { background:#dff5ff!important; color:var(--ink-900)!important; border-radius:999px!important; }
.brand-icon,.icon-core,.icon-wrap { background:#bceaff!important; }
.banner,.sidebar-banner { border-radius:13px!important; overflow:hidden; }
.about-desc,.subtitle,.modal-desc { color:#3b607a!important; }
.social-btn:hover { animation:cutePop .35s ease; }
/* Soft floating motion on visual elements without moving text or controls */
.banner,.sidebar-banner,.icon-wrap { animation:cloudFloat 6s ease-in-out infinite; }
button,a,[role="button"] { -webkit-tap-highlight-color:transparent; }
button:focus-visible,a:focus-visible { outline:3px dashed #168bd0!important; outline-offset:3px; }

/* === SKY CLOUD NEOBRUTALISM • POLISH UPDATE === */
:root {
  --sky-ink: #102a43;
  --sky-blue: #2aa9f7;
  --sky-light: #e8f7ff;
  --sky-border: 2px solid var(--sky-ink);
  --sky-shadow: 5px 5px 0 var(--sky-ink);
  --sky-shadow-hover: 7px 8px 0 var(--sky-ink);
}
html { scroll-padding-top: 24px; }
body {
  isolation: isolate;
  background-color: #f2faff;
  background-image:
    radial-gradient(ellipse at 12% 8%, rgba(255,255,255,.98) 0, transparent 34%),
    radial-gradient(ellipse at 90% 18%, rgba(177,229,255,.72) 0, transparent 32%),
    radial-gradient(ellipse at 45% 100%, rgba(212,242,255,.8) 0, transparent 40%),
    linear-gradient(145deg,#f7fcff 0%,#eaf7ff 48%,#f8fcff 100%);
}
body::after {
  content: "";
  position: fixed;
  z-index: -1;
  width: 270px;
  height: 150px;
  right: -80px;
  top: 20%;
  border: 2px solid rgba(16,42,67,.09);
  border-radius: 100px;
  background: rgba(255,255,255,.32);
  box-shadow: -35px 35px 0 -12px rgba(255,255,255,.32), -70px 15px 0 -20px rgba(255,255,255,.42);
  filter: blur(.2px);
  pointer-events: none;
  animation: cloudFloat 9s ease-in-out infinite;
}
::selection { color: #102a43; background: #a9e2ff; }
button, input, textarea, select { font: inherit; }
button, a, [role="button"] { touch-action: manipulation; }
button:disabled { cursor: wait !important; opacity: .68; transform: none !important; }
.header, .section, .about, .card, .loading-card, .results, .form-body, .loading-visual {
  border: var(--sky-border) !important;
  border-radius: 18px !important;
  box-shadow: var(--sky-shadow) !important;
  transition: box-shadow .22s ease, transform .22s ease, border-color .22s ease;
}
.header:hover, .section:hover, .about:hover, .card:hover, .loading-card:hover, .results:hover {
  box-shadow: 6px 7px 0 var(--sky-ink) !important;
}
.header-top, .term-head, .sidebar-head {
  background: linear-gradient(110deg,#bfeaff,#e7f8ff 58%,#c9edff) !important;
  border-bottom: var(--sky-border) !important;
}
.title, h1, h2, h3 { text-wrap: balance; }
.title { letter-spacing: -.045em; }
.title span { color: #087fca !important; }
.subtitle, .about-desc, .modal-desc { line-height: 1.75; }
.badge, .status, .pill, .tag {
  border: 2px solid var(--sky-ink) !important;
  box-shadow: 2px 2px 0 var(--sky-ink) !important;
  background: #dff4ff !important;
}
.execute-btn, .modal-join-btn {
  position: relative;
  overflow: hidden;
  border: 2px solid var(--sky-ink) !important;
  border-radius: 12px !important;
  box-shadow: 4px 4px 0 var(--sky-ink) !important;
  color: var(--sky-ink) !important;
  background: linear-gradient(110deg,#8bdcff,#c9f0ff,#8bdcff) !important;
  background-size: 220% 100% !important;
  animation: skyShimmer 6s ease-in-out infinite;
  font-weight: 800 !important;
}
.execute-btn:hover, .modal-join-btn:hover {
  transform: translate(-2px,-3px) rotate(-.4deg) !important;
  box-shadow: var(--sky-shadow-hover) !important;
  background-position: 100% 50% !important;
}
.action-btn, .sidebar-item, .copy-value, .channel-link, .result-actions button, .about-footer a {
  border: 2px solid var(--sky-ink) !important;
  border-radius: 11px !important;
  box-shadow: 3px 3px 0 var(--sky-ink) !important;
  transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, background .18s ease !important;
  font-weight: 800 !important;
}
.action-btn:hover, .sidebar-item:hover, .copy-value:hover, .channel-link:hover, .result-actions button:hover, .about-footer a:hover {
  transform: translate(-2px,-2px) !important;
  box-shadow: 5px 5px 0 var(--sky-ink) !important;
  background-color: #a8e3ff !important;
}
.action-btn:active, .sidebar-item:active, .copy-value:active, .channel-link:active, .execute-btn:active, .modal-join-btn:active {
  transform: translate(2px,2px) scale(.985) !important;
  box-shadow: 1px 1px 0 var(--sky-ink) !important;
}
input, textarea, select, .input-wrapper input, .field input, .field textarea {
  border: 2px solid var(--sky-ink) !important;
  border-radius: 11px !important;
  min-height: 44px;
  transition: box-shadow .18s ease, background .18s ease;
}
input:focus, textarea:focus, select:focus, .input-wrapper input:focus, .field input:focus, .field textarea:focus {
  outline: none !important;
  box-shadow: 0 0 0 4px rgba(42,169,247,.22), 3px 3px 0 var(--sky-ink) !important;
}
.social-btn { border-radius: 13px !important; }
.icon-wrap { filter: drop-shadow(0 8px 0 rgba(16,42,67,.06)); }
.sidebar { box-shadow: 9px 0 0 rgba(16,42,67,.08) !important; }
.sidebar-brand { border-radius: 14px !important; }
.modal { border: 2px solid var(--sky-ink) !important; box-shadow: 8px 8px 0 var(--sky-ink) !important; }
.toast { border: 2px solid var(--sky-ink) !important; border-radius: 14px !important; box-shadow: 4px 4px 0 var(--sky-ink) !important; }
.empty { border-radius: 14px !important; }
@keyframes skyShimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@media (max-width: 600px) {
  body { background-attachment: scroll; }
  .header, .section, .about, .card, .loading-card, .results, .form-body, .loading-visual { box-shadow: 3px 3px 0 var(--sky-ink) !important; }
  .execute-btn, .modal-join-btn { width: 100%; min-height: 46px; }
  .social-grid { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  body::after, .execute-btn, .modal-join-btn { animation: none !important; }
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
